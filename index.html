<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta aí</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho"  >
        <h1>Conecta aí!</h1>
        <nav>
            <a href="#" class="cabecalho-link" > Início </a>
        </nav>
    </header>

    <main>
        <h2>Descubra a verdade passando o mouse</h2>
        <section>
            <article class="cartao" >
                <div class="cartao-interno">
                    <div class="cartao-frente">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/1/1e/Bald_Eagle_Portrait.jpg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original
" alt="Imagem de Águia " class="cartao-imagem">
                        <p>Verdade: Elas enxergam uma presa a 3 km de distancia.</p>
                    </div>
                    <div class="cartao-verso">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/1/1e/Bald_Eagle_Portrait.jpg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original" alt="Imagem de Pinguim " class="cartao-imagem">
                        <p>Mentira: Águias arrancam o próprio bico para se renovar.</p>
                    </div>
                </div>
            </article>

            <article class="cartao" >
                <div class="cartao-interno">
                    <div class="cartao-frente">
                        <img src="https://static.todamateria.com.br/upload/po/lv/polvos-og.jpg
" alt="Imagem de polvo " class="cartao-imagem">
                        <p>Mentira: Polvo são burros. .</p>
                    </div>
                    <div class="cartao-verso">
                        <img src="https://static.todamateria.com.br/upload/po/lv/polvos-og.jpg" class="cartao-imagem">
                        <p>Verdade: Polvo são super inteligentes.</p>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <footer>
        <p>Kauan.</p>
    </footer>
    
</body>
</html>
